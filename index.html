<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Controle • Casa & Assinaturas</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Controle">
  <meta name="theme-color" content="#F2F2F7">

  <style>
    :root {
      --bg-primary: #F2F2F7;
      --bg-elevated: #FFFFFF;
      --bg-glass: rgba(242, 242, 247, 0.82);
      --bg-segmented: #E5E5EA;
      --graphite-dark: #1C1C1E;
      --graphite-mid: #2C2C2E;
      --graphite-soft: #3A3A3C;
      --text-primary: #1C1C1E;
      --text-secondary: #636366;
      --text-muted: #8E8E93;
      --border-hairline: rgba(60, 60, 67, 0.14);
      --border-strong: #D1D1D6;
      
      --paid-bg: #E8F5E9;
      --paid-text: #1B5E20;
      --pending-bg: #F2F2F7;
      --pending-text: #636366;
      --alert-bg: #FFF4E5;
      --alert-text: #B45309;
      --danger-text: #FF3B30;

      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding-bottom: 60px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-glass);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 0.5px solid var(--border-hairline);
      padding: 14px 20px 16px;
    }

    .app-shell {
      max-width: 960px;
      margin: 0 auto;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-title span {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
    }

    .brand-title h1 {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-primary);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    @media (max-width: 680px) {
      .nav-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .nav-actions {
        width: 100%;
        justify-content: flex-start;
        gap: 6px;
      }
      .btn-ios {
        padding: 0 10px;
        font-size: 0.78rem;
        height: 34px;
      }
    }

    .btn-ios {
      height: 36px;
      padding: 0 12px;
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: transform 0.12s ease, opacity 0.12s ease, background 0.15s ease;
      white-space: nowrap;
    }

    .btn-ios:active {
      transform: scale(0.96);
      opacity: 0.85;
    }

    .btn-ios-primary {
      background: var(--graphite-dark);
      color: #FFFFFF;
    }

    .btn-ios-secondary {
      background: var(--bg-segmented);
      color: var(--text-primary);
    }

    .segmented-wrapper {
      display: flex;
      justify-content: center;
    }

    .segmented-control {
      background: var(--bg-segmented);
      padding: 3px;
      border-radius: 11px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      max-width: 420px;
    }

    .seg-btn {
      border: none;
      background: transparent;
      padding: 7px 14px;
      border-radius: 9px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
      text-align: center;
    }

    .seg-btn.active {
      background: var(--bg-elevated);
      color: var(--text-primary);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08), 0 0.5px 1px rgba(0, 0, 0, 0.05);
    }

    .main-container {
      max-width: 960px;
      margin: 0 auto;
      padding: 18px 20px;
    }

    /* Painel do Ciclo de Contas */
    .cycle-bar-wrapper {
      background: var(--bg-elevated);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      border: 0.5px solid var(--border-hairline);
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }

    .status-counter {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .subs-summary-card {
      background: linear-gradient(145deg, var(--graphite-dark), var(--graphite-mid));
      color: #FFFFFF;
      border-radius: var(--radius-lg);
      padding: 20px 22px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .summary-metric {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .summary-metric small {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: #AEAEB2;
      font-weight: 600;
    }

    .summary-metric h2 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.6px;
      color: #FFFFFF;
    }

    .summary-metric.secondary h3 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #E5E5EA;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 720px) {
      .cards-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }
    }

    .ios-card {
      background: var(--bg-elevated);
      border-radius: var(--radius-md);
      padding: 15px 16px;
      border: 0.5px solid var(--border-hairline);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
      flex: 1;
    }

    .check-circle {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid var(--border-strong);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.18s ease;
      color: transparent;
      font-size: 0.85rem;
    }

    .check-circle.paid {
      background: var(--graphite-dark);
      border-color: var(--graphite-dark);
      color: #FFFFFF;
    }

    .item-details {
      min-width: 0;
      flex: 1;
    }

    .item-title {
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .item-title.paid-text {
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .item-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    .badge {
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .badge-paid { background: var(--paid-bg); color: var(--paid-text); }
    .badge-pending { background: var(--pending-bg); color: var(--pending-text); }
    .badge-alert { background: var(--alert-bg); color: var(--alert-text); }

    .card-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .price-block { text-align: right; }
    .price-value { font-size: 0.96rem; font-weight: 700; color: var(--text-primary); }
    .price-optional { font-size: 0.76rem; font-weight: 500; color: var(--text-muted); }

    .edit-btn {
      background: var(--bg-primary);
      color: var(--text-secondary);
      border: none;
      height: 32px;
      padding: 0 11px;
      border-radius: 8px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 20px;
      background: var(--bg-elevated);
      border-radius: var(--radius-md);
      border: 0.5px dashed var(--border-strong);
      color: var(--text-muted);
    }
    .empty-state p { font-size: 0.9rem; margin-bottom: 14px; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      display: none; align-items: flex-end; justify-content: center; z-index: 100;
    }
    .modal-overlay.active { display: flex; }

    .modal-sheet {
      background: var(--bg-elevated); width: 100%; max-width: 460px;
      border-top-left-radius: 22px; border-top-right-radius: 22px;
      padding: 22px 20px 30px; box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.15);
      animation: sheetUp 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @media (min-width: 700px) {
      .modal-overlay { align-items: center; padding: 20px; }
      .modal-sheet { border-radius: 22px; padding: 24px; }
    }
    @keyframes sheetUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .modal-header h3 { font-size: 1.1rem; font-weight: 700; }
    .close-btn {
      background: var(--bg-primary); border: none; width: 30px; height: 30px;
      border-radius: 50%; font-size: 0.9rem; font-weight: 700; color: var(--text-secondary); cursor: pointer;
    }

    .form-group { margin-bottom: 14px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
    input, select {
      width: 100%; height: 42px; padding: 0 12px; border-radius: 10px;
      border: 1px solid var(--border-strong); background: var(--bg-primary); font-size: 0.95rem; color: var(--text-primary); outline: none;
    }
    input:focus, select:focus { border-color: var(--graphite-dark); background: #FFFFFF; }

    .modal-footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 20px; }
    .btn-modal { height: 42px; padding: 0 18px; border-radius: 11px; font-size: 0.9rem; font-weight: 600; border: none; cursor: pointer; flex: 1; }
    .btn-modal-save { background: var(--graphite-dark); color: #FFFFFF; }
    .btn-modal-delete { background: #FFF1F0; color: var(--danger-text); flex: 0 0 auto; }

    #toast {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-80px);
      background: var(--graphite-dark); color: #FFFFFF; padding: 10px 18px; border-radius: 99px;
      font-size: 0.82rem; font-weight: 600; box-shadow: 0 8px 20px rgba(0,0,0,0.18);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 300; white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div id="toast">Pronto</div>

  <header>
    <div class="app-shell">
      <div class="nav-bar">
        <div class="brand-title">
          <span>Gestão Pessoal</span>
          <h1 id="mainTitle">Contas da Casa</h1>
        </div>
        <div class="nav-actions">
          <button class="btn-ios btn-ios-secondary" onclick="sincronizarManual()" title="Sincronizar com a nuvem">🔄 Sincronizar</button>
          <button class="btn-ios btn-ios-secondary" onclick="abrirConfigSync()" title="Configurar Token">⚙️ Token</button>
          <button class="btn-ios btn-ios-secondary" onclick="enviarRelatorioWhatsApp()" title="Enviar relatório para Rayssa">📄 Relatório</button>
          <button class="btn-ios btn-ios-primary" onclick="abrirModalNovo()"><span id="btnNovoTexto">+ Nova Conta</span></button>
        </div>
      </div>

      <div class="segmented-wrapper">
        <div class="segmented-control">
          <button class="seg-btn active" id="segContas" onclick="alternarModo('contas')">Contas da Casa</button>
          <button class="seg-btn" id="segAssinaturas" onclick="alternarModo('assinaturas')">Assinaturas</button>
        </div>
      </div>
    </div>
  </header>

  <main class="main-container">
    <section id="viewContas">
      <div class="cycle-bar-wrapper">
        <div class="status-counter" id="progressoGeralDisplay">0 de 0 pagas</div>
        <button class="btn-ios btn-ios-secondary" onclick="zerarCiclo()" title="Zerar checks para o próximo ciclo de pagamento">🔄 Novo Ciclo</button>
      </div>

      <div class="cards-grid" id="gridContas"></div>
    </section>

    <section id="viewAssinaturas" style="display: none;">
      <div class="subs-summary-card">
        <div class="summary-metric">
          <small>Custo Mensal de Assinaturas</small>
          <h2 id="somaMensalSubs">R$ 0,00</h2>
        </div>
        <div class="summary-metric secondary" style="text-align: right;">
          <small>Projeção Anual</small>
          <h3 id="somaAnualSubs">R$ 0,00</h3>
        </div>
      </div>

      <div class="cards-grid" id="gridAssinaturas"></div>
    </section>
  </main>

  <!-- Modal Adicionar / Editar -->
  <div id="modalForm" class="modal-overlay" onclick="fecharModalFora(event)">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 id="modalTitulo">Adicionar Conta</h3>
        <button class="close-btn" onclick="fecharModal()">✕</button>
      </div>

      <input type="hidden" id="editIndex" value="-1">

      <div class="form-group">
        <label id="labelNome">Nome da Conta</label>
        <input type="text" id="inputNome" placeholder="Ex: Energia, Água, Escola...">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label id="labelValor">Valor (Opcional)</label>
          <input type="number" id="inputValor" placeholder="Ex: 180,00" step="0.01" inputmode="decimal">
        </div>
        <div class="form-group">
          <label id="labelDia">Dia do Vencimento</label>
          <input type="number" id="inputDia" placeholder="1 a 31" min="1" max="31" inputmode="numeric">
        </div>
      </div>

      <div class="form-group" id="grupoCiclo" style="display: none;">
        <label>Ciclo de Cobrança</label>
        <select id="inputCiclo">
          <option value="mensal">Mensal</option>
          <option value="anual">Anual (calcula equivalência mensal)</option>
        </select>
      </div>

      <div class="modal-footer">
        <button class="btn-modal btn-modal-delete" id="btnExcluir" style="display: none;" onclick="excluirRegistro()">Excluir</button>
        <button class="btn-modal btn-modal-save" onclick="salvarRegistro()">Salvar</button>
      </div>
    </div>
  </div>

  <!-- Modal Configuração Gist Sync -->
  <div id="modalSync" class="modal-overlay" onclick="if(event.target.id==='modalSync') fecharConfigSync()">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3>Configurar Token do GitHub</h3>
        <button class="close-btn" onclick="fecharConfigSync()">✕</button>
      </div>
      <div class="form-group">
        <label>GitHub Personal Access Token (ghp_...)</label>
        <input type="password" id="inputToken" placeholder="Cole seu token aqui">
      </div>
      <p style="font-size:0.76rem; color:var(--text-secondary); margin-bottom:14px;">
        Cole o mesmo token do GitHub tanto no iPhone quanto no iPad.
      </p>
      <div class="modal-footer">
        <button class="btn-modal btn-modal-save" onclick="salvarConfigSync()">Salvar Token</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'controle_ios_titanium_v4';
    const SYNC_CONFIG_KEY = 'controle_sync_config_v4';

    let modoAtivo = 'contas';

    let estado = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
      contas: [],
      assinaturas: [],
      deletedIds: []
    };

    if (estado.contas) estado.contas.forEach(c => { if (!c.id) c.id = 'acc_' + Math.random().toString(36).substr(2, 9); });
    if (estado.assinaturas) estado.assinaturas.forEach(s => { if (!s.id) s.id = 'sub_' + Math.random().toString(36).substr(2, 9); });
    if (!estado.deletedIds) estado.deletedIds = [];

    let syncConfig = JSON.parse(localStorage.getItem(SYNC_CONFIG_KEY)) || {
      token: '',
      gistId: ''
    };

    renderizarTudo();

    if (syncConfig.token) {
      baixarDaNuvem();
    }

    function salvarNoAparelho() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(estado));
      renderizarTudo();
      enviarParaNuvem();
    }

    async function descobrirGistAutomaticamente() {
      if (!syncConfig.token) return;
      try {
        const res = await fetch('https://api.github.com/gists', {
          headers: {
            'Authorization': `token ${syncConfig.token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });
        if (res.ok) {
          const gists = await res.json();
          const meuGist = gists.find(g => g.files && g.files['dados_controle.json']);
          if (meuGist) {
            syncConfig.gistId = meuGist.id;
            localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(syncConfig));
          }
        }
      } catch (e) {
        console.log('Erro ao procurar Gist:', e);
      }
    }

    function isPago(conta) {
      if (!conta.pago) return false;
      let val = conta.pago;
      if (typeof val === 'object' && val !== null) {
        return Boolean(val.checked);
      }
      return Boolean(val);
    }

    function mesclarDadosNuvem(dadosNuvem) {
      if (!dadosNuvem) return;

      let allDeleted = new Set([...(estado.deletedIds || []), ...(dadosNuvem.deletedIds || [])]);
      estado.deletedIds = Array.from(allDeleted);

      if (dadosNuvem.contas) {
        dadosNuvem.contas.forEach(cn => {
          if (!cn.id) cn.id = 'acc_' + Math.random().toString(36).substr(2, 9);
          if (allDeleted.has(cn.id)) return;

          let existente = estado.contas.find(c => c.id === cn.id);
          if (!existente) {
            estado.contas.push(cn);
          } else {
            existente.nome = cn.nome;
            existente.valor = cn.valor;
            existente.dia = cn.dia;
            
            if (cn.pago !== undefined) {
              let incoming = cn.pago;
              let local = existente.pago;

              let incObj = (typeof incoming === 'object' && incoming !== null) ? incoming : { checked: Boolean(incoming), time: 0 };
              let locObj = (typeof local === 'object' && local !== null) ? local : { checked: Boolean(local), time: 0 };

              if (incObj.time >= locObj.time) {
                existente.pago = incObj;
              }
            }
          }
        });
      }
      estado.contas = estado.contas.filter(c => !allDeleted.has(c.id));

      if (dadosNuvem.assinaturas) {
        dadosNuvem.assinaturas.forEach(sn => {
          if (!sn.id) sn.id = 'sub_' + Math.random().toString(36).substr(2, 9);
          if (allDeleted.has(sn.id)) return;

          let existente = estado.assinaturas.find(s => s.id === sn.id);
          if (!existente) {
            estado.assinaturas.push(sn);
          } else {
            existente.nome = sn.nome;
            existente.valor = sn.valor;
            existente.dia = sn.dia;
            existente.ciclo = sn.ciclo;
          }
        });
      }
      estado.assinaturas = estado.assinaturas.filter(s => !allDeleted.has(s.id));

      localStorage.setItem(STORAGE_KEY, JSON.stringify(estado));
      renderizarTudo();
    }

    async function baixarDaNuvem() {
      if (!syncConfig.token) return;
      if (!syncConfig.gistId) {
        await descobrirGistAutomaticamente();
      }
      if (!syncConfig.gistId) return;

      try {
        const res = await fetch(`https://api.github.com/gists/${syncConfig.gistId}`, {
          headers: {
            'Authorization': `token ${syncConfig.token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });
        if (res.ok) {
          const data = await res.json();
          const arquivo = data.files['dados_controle.json'];
          if (arquivo) {
            const dadosNuvem = JSON.parse(arquivo.content);
            mesclarDadosNuvem(dadosNuvem);
          }
        }
      } catch (e) {
        console.log('Modo offline ou erro ao baixar:', e);
      }
    }

    async function enviarParaNuvem() {
      if (!syncConfig.token) return;
      if (!syncConfig.gistId) {
        await descobrirGistAutomaticamente();
      }

      try {
        const headers = {
          'Authorization': `token ${syncConfig.token}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        };
        const body = {
          description: "Sincronização Automática Gestor Casa & Assinaturas",
          files: {
            "dados_controle.json": {
              content: JSON.stringify(estado, null, 2)
            }
          }
        };

        let url = 'https://api.github.com/gists';
        let method = 'POST';
        if (syncConfig.gistId) {
          url = `https://api.github.com/gists/${syncConfig.gistId}`;
          method = 'PATCH';
        }

        const resGist = await fetch(url, {
          method: method,
          headers: headers,
          body: JSON.stringify(body)
        });

        if (resGist.ok) {
          const dataGist = await resGist.json();
          if (!syncConfig.gistId) {
            syncConfig.gistId = dataGist.id;
            localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(syncConfig));
          }
        }
      } catch (e) {
        console.log('Erro ao enviar para nuvem:', e);
      }
    }

    async function sincronizarManual() {
      if (!syncConfig.token) {
        abrirConfigSync();
        return;
      }
      mostrarToast('Sincronizando com a nuvem...');
      await baixarDaNuvem();
      await enviarParaNuvem();
      mostrarToast('Tudo atualizado!');
    }

    function abrirConfigSync() {
      document.getElementById('inputToken').value = syncConfig.token || '';
      document.getElementById('modalSync').classList.add('active');
    }
    function fecharConfigSync() {
      document.getElementById('modalSync').classList.remove('active');
    }
    function salvarConfigSync() {
      syncConfig.token = document.getElementById('inputToken').value.trim();
      syncConfig.gistId = ''; 
      localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(syncConfig));
      fecharConfigSync();
      mostrarToast('Token salvo! Baixando dados...');
      baixarDaNuvem();
    }

    function alternarModo(novoModo) {
      modoAtivo = novoModo;
      const isContas = novoModo === 'contas';

      document.getElementById('segContas').classList.toggle('active', isContas);
      document.getElementById('segAssinaturas').classList.toggle('active', !isContas);

      document.getElementById('viewContas').style.display = isContas ? 'block' : 'none';
      document.getElementById('viewAssinaturas').style.display = isContas ? 'none' : 'block';

      document.getElementById('mainTitle').textContent = isContas ? 'Contas da Casa' : 'Assinaturas';
      document.getElementById('btnNovoTexto').textContent = isContas ? '+ Nova Conta' : '+ Assinatura';

      renderizarTudo();
    }

    function zerarCiclo() {
      if (confirm('Deseja desmarcar todas as contas para iniciar um novo ciclo?')) {
        let now = Date.now();
        estado.contas.forEach(c => {
          c.pago = { checked: false, time: now };
        });
        salvarNoAparelho();
        mostrarToast('Novo ciclo iniciado');
      }
    }

    function renderizarTudo() {
      renderizarContas();
      renderizarAssinaturas();
    }

    function renderizarContas() {
      const totalContas = estado.contas.length;
      let pagasGeral = 0;
      const grid = document.getElementById('gridContas');
      grid.innerHTML = '';

      if (totalContas === 0) {
        document.getElementById('progressoGeralDisplay').textContent = 'Nenhuma conta';
        grid.innerHTML = `<div class="empty-state"><p>Nenhuma conta fixa cadastrada.</p><button class="btn-ios btn-ios-primary" onclick="abrirModalNovo()">Adicionar Primeira Conta</button></div>`;
        return;
      }

      estado.contas.forEach((conta, index) => {
        const pago = isPago(conta);
        if (pago) pagasGeral++;

        const temValor = conta.valor !== null && conta.valor !== '' && !isNaN(conta.valor);
        const valorFormatado = temValor ? Number(conta.valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) : '';

        const card = document.createElement('div');
        card.className = 'ios-card';
        card.innerHTML = `
          <div class="card-left">
            <button class="check-circle ${pago ? 'paid' : ''}" onclick="alternarPagamentoConta(${index})">✓</button>
            <div class="item-details">
              <div class="item-title ${pago ? 'paid-text' : ''}">${conta.nome}</div>
              <div class="item-meta">
                <span>Vencimento dia ${conta.dia || '--'}</span>
                <span class="badge ${pago ? 'badge-paid' : 'badge-pending'}">${pago ? 'Pago' : 'Pendente'}</span>
              </div>
            </div>
          </div>
          <div class="card-right">
            <div class="price-block">
              ${temValor ? `<div class="price-value">${valorFormatado}</div>` : `<div class="price-optional">Sem valor fixo</div>`}
            </div>
            <button class="edit-btn" onclick="abrirModalEdicao(${index})">Editar</button>
          </div>
        `;
        grid.appendChild(card);
      });

      document.getElementById('progressoGeralDisplay').textContent = `${pagasGeral} de ${totalContas} pagas`;
    }

    function renderizarAssinaturas() {
      const grid = document.getElementById('gridAssinaturas');
      grid.innerHTML = '';
      let somaMensal = 0;
      const diaHoje = hoje.getDate();

      if (estado.assinaturas.length === 0) {
        document.getElementById('somaMensalSubs').textContent = 'R$ 0,00';
        document.getElementById('somaAnualSubs').textContent = 'R$ 0,00';
        grid.innerHTML = `<div class="empty-state"><p>Nenhuma assinatura cadastrada.</p><button class="btn-ios btn-ios-primary" onclick="abrirModalNovo()">Adicionar Assinatura</button></div>`;
        return;
      }

      estado.assinaturas.forEach((sub, index) => {
        const valorNum = Number(sub.valor) || 0;
        somaMensal += (sub.ciclo === 'anual' ? valorNum / 12 : valorNum);

        let diasParaRenovar = sub.dia - diaHoje;
        if (diasParaRenovar < 0) diasParaRenovar += 30;
        const alertaProximo = diasParaRenovar <= 5;
        const valorExibido = valorNum.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        const sufixoCiclo = sub.ciclo === 'anual' ? '/ano' : '/mês';

        const card = document.createElement('div');
        card.className = 'ios-card';
        card.innerHTML = `
          <div class="card-left">
            <div class="item-details">
              <div class="item-title">${sub.nome}</div>
              <div class="item-meta">
                <span>Dia ${sub.dia}</span>
                ${alertaProximo ? `<span class="badge badge-alert">Renova em ${diasParaRenovar === 0 ? 'hoje' : diasParaRenovar + 'd'}</span>` : `<span class="badge badge-pending">${sub.ciclo === 'anual' ? 'Anual' : 'Mensal'}</span>`}
              </div>
            </div>
          </div>
          <div class="card-right">
            <div class="price-block">
              <div class="price-value">${valorExibido}<span style="font-size:0.72rem; font-weight:500; color:var(--text-muted);">${sufixoCiclo}</span></div>
            </div>
            <button class="edit-btn" onclick="abrirModalEdicao(${index})">Editar</button>
          </div>
        `;
        grid.appendChild(card);
      });

      const somaAnual = somaMensal * 12;
      document.getElementById('somaMensalSubs').textContent = somaMensal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      document.getElementById('somaAnualSubs').textContent = somaAnual.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function alternarPagamentoConta(index) {
      const conta = estado.contas[index];
      let atual = isPago(conta);
      conta.pago = {
        checked: !atual,
        time: Date.now()
      };
      salvarNoAparelho();
    }

    function configurarCamposModal(isEdicao) {
      const isContas = modoAtivo === 'contas';
      document.getElementById('modalTitulo').textContent = isEdicao ? (isContas ? 'Editar Conta' : 'Editar Assinatura') : (isContas ? 'Nova Conta da Casa' : 'Nova Assinatura');
      document.getElementById('labelNome').textContent = isContas ? 'Nome da Conta' : 'Serviço / Assinatura';
      document.getElementById('inputNome').placeholder = isContas ? 'Ex: Energia, Internet, Escola' : 'Ex: iCloud+, CapCut Pro, Netflix';
      document.getElementById('labelValor').textContent = isContas ? 'Valor (Opcional)' : 'Valor da Assinatura (R$)';
      document.getElementById('labelDia').textContent = isContas ? 'Dia do Vencimento' : 'Dia da Cobrança';
      document.getElementById('grupoCiclo').style.display = isContas ? 'none' : 'block';
      document.getElementById('btnExcluir').style.display = isEdicao ? 'inline-block' : 'none';
    }

    function abrirModalNovo() {
      document.getElementById('editIndex').value = '-1';
      document.getElementById('inputNome').value = '';
      document.getElementById('inputValor').value = '';
      document.getElementById('inputDia').value = '';
      document.getElementById('inputCiclo').value = 'mensal';
      configurarCamposModal(false);
      document.getElementById('modalForm').classList.add('active');
    }

    function abrirModalEdicao(index) {
      const lista = modoAtivo === 'contas' ? estado.contas : estado.assinaturas;
      const item = lista[index];
      document.getElementById('editIndex').value = String(index);
      document.getElementById('inputNome').value = item.nome || '';
      document.getElementById('inputValor').value = (item.valor !== null && item.valor !== undefined) ? item.valor : '';
      document.getElementById('inputDia').value = item.dia || '';
      document.getElementById('inputCiclo').value = item.ciclo || 'mensal';
      configurarCamposModal(true);
      document.getElementById('modalForm').classList.add('active');
    }

    function fecharModal() { document.getElementById('modalForm').classList.remove('active'); }
    function fecharModalFora(e) { if (e.target.id === 'modalForm') fecharModal(); }

    function salvarRegistro() {
      const index = parseInt(document.getElementById('editIndex').value, 10);
      const nome = document.getElementById('inputNome').value.trim();
      const valorRaw = document.getElementById('inputValor').value.trim();
      const diaRaw = parseInt(document.getElementById('inputDia').value, 10);
      const ciclo = document.getElementById('inputCiclo').value;

      if (!nome) { mostrarToast('Digite um nome válido'); return; }
      const dia = (!isNaN(diaRaw) && diaRaw >= 1 && diaRaw <= 31) ? diaRaw : 10;

      if (modoAtivo === 'contas') {
        const valorOpcional = valorRaw === '' ? null : parseFloat(valorRaw);
        if (index >= 0) {
          estado.contas[index].nome = nome;
          estado.contas[index].valor = isNaN(valorOpcional) ? null : valorOpcional;
          estado.contas[index].dia = dia;
        } else {
          estado.contas.push({
            id: 'acc_' + Math.random().toString(36).substr(2, 9),
            nome,
            valor: isNaN(valorOpcional) ? null : valorOpcional,
            dia,
            pago: { checked: false, time: Date.now() }
          });
        }
        estado.contas.sort((a, b) => a.dia - b.dia);
      } else {
        const valorAssinatura = parseFloat(valorRaw);
        if (isNaN(valorAssinatura) || valorAssinatura <= 0) { mostrarToast('Informe o valor da assinatura'); return; }
        if (index >= 0) {
          estado.assinaturas[index].nome = nome;
          estado.assinaturas[index].valor = valorAssinatura;
          estado.assinaturas[index].dia = dia;
          estado.assinaturas[index].ciclo = ciclo;
        } else {
          estado.assinaturas.push({
            id: 'sub_' + Math.random().toString(36).substr(2, 9),
            nome,
            valor: valorAssinatura,
            dia,
            ciclo
          });
        }
        estado.assinaturas.sort((a, b) => a.dia - b.dia);
      }

      salvarNoAparelho();
      fecharModal();
      mostrarToast('Salvo com sucesso');
    }

    function excluirRegistro() {
      const index = parseInt(document.getElementById('editIndex').value, 10);
      if (index < 0) return;
      const lista = modoAtivo === 'contas' ? estado.contas : estado.assinaturas;
      const itemRemovido = lista[index];
      
      if (itemRemovido && itemRemovido.id) {
        if (!estado.deletedIds) estado.deletedIds = [];
        estado.deletedIds.push(itemRemovido.id);
      }

      lista.splice(index, 1);
      salvarNoAparelho();
      fecharModal();
      mostrarToast('Removido');
    }

    function enviarRelatorioWhatsApp() {
      let texto = `📊 *Relatório de Contas da Casa*\n\n`;
      
      texto += `🏠 *Contas:*\n`;
      if (estado.contas.length === 0) {
        texto += `Nenhuma conta cadastrada.\n`;
      } else {
        estado.contas.forEach(c => {
          const pago = isPago(c);
          const status = pago ? '✅ Pago' : '⏳ Pendente';
          const valStr = (c.valor !== null && c.valor !== '' && !isNaN(c.valor)) ? ` - R$ ${Number(c.valor).toFixed(2).replace('.', ',')}` : '';
          texto += `• ${c.nome}${valStr} ➔ *${status}*\n`;
        });
      }

      texto += `\n🔄 *Assinaturas:*\n`;
      if (estado.assinaturas.length === 0) {
        texto += `Nenhuma assinatura cadastrada.\n`;
      } else {
        let somaSubs = 0;
        estado.assinaturas.forEach(s => {
          const valNum = Number(s.valor) || 0;
          somaSubs += (s.ciclo === 'anual' ? valNum / 12 : valNum);
          texto += `• ${s.nome}: R$ ${valNum.toFixed(2).replace('.', ',')} (${s.ciclo})\n`;
        });
        texto += `\n*Total Mensal:* R$ ${somaSubs.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      }

      const urlWhatsApp = `https://wa.me/?text=${encodeURIComponent(texto)}`;
      window.open(urlWhatsApp, '_blank');
    }

    function mostrarToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2600);
    }
  </script>
</body>
</html>
